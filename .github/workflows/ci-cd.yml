name: Validate and release Bop
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      waf_mode:
        description: WAF behavior after reviewing representative request logs
        type: choice
        options: [current, count, block]
        default: current
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:lambda
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
      - run: terraform fmt -recursive -check terraform
      - name: Validate both stacks offline
        run: |
          set -euo pipefail
          for stack in bootstrap app; do
            terraform -chdir="terraform/$stack" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="terraform/$stack" validate
            terraform -chdir="terraform/$stack" test
          done

  deploy:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.AWS_ACCOUNT_ID != '' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_REGION != '' && vars.TF_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: bop-application-release
      cancel-in-progress: false
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEPLOY_ROLE: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_repository: ${{ github.repository }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_environment: ${{ vars.BOP_ENVIRONMENT || 'poc' }}
      WAF_INPUT: ${{ inputs.waf_mode || 'current' }}
      TF_IN_AUTOMATION: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run package:lambda
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Check deployment parameters
        run: |
          set -euo pipefail
          [[ "$TF_VAR_account_id" =~ ^[0-9]{8}0081$ ]]
          [[ "$DEPLOY_ROLE" == "arn:aws:iam::${TF_VAR_account_id}:role/"* ]]
          [[ "$TF_VAR_environment" =~ ^[a-z][a-z0-9-]{0,12}$ ]]
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: bop-release-${{ github.run_id }}
      - name: Verify the sanctioned account
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$account" == "$TF_VAR_account_id" && "$account" == *0081 ]]
      - name: Initialize locked state
        working-directory: terraform/app
        run: terraform init -input=false -lockfile=readonly -backend-config="bucket=$STATE_BUCKET" -backend-config="key=bop/$TF_VAR_environment/terraform.tfstate" -backend-config="region=$AWS_REGION"
      - name: Plan and apply the saved release
        working-directory: terraform/app
        run: |
          set -euo pipefail
          if [[ "$WAF_INPUT" == current ]]; then
            TF_VAR_waf_mode="$(terraform output -raw waf_mode)"
          else
            TF_VAR_waf_mode="$WAF_INPUT"
          fi
          [[ "$TF_VAR_waf_mode" == count || "$TF_VAR_waf_mode" == block ]]
          export TF_VAR_waf_mode
          terraform plan -input=false -out=release.tfplan
          terraform apply -input=false release.tfplan
      - name: Check public health and S3 privacy
        working-directory: terraform/app
        run: |
          set -euo pipefail
          site="$(terraform output -raw site_url)"
          origin="$(terraform output -raw frontend_origin)"
          curl --fail --silent --show-error --retry 8 --retry-all-errors --retry-delay 5 "$site/api/health" --output /dev/null
          direct="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$origin/index.html")"
          [[ "$direct" == 403 ]]
